name: Verificaciones

on:
  push:
    branches: [main, "chore/**", "feat/**", "fix/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Comprobar sintaxis
        run: |
          node --check scripts/build-public.mjs
          node --check tests/public-build.test.mjs
          node --check assets/site.js
          node --check assets/app.js
          node --check src/project.mjs
          node --check src/domain/authorization.mjs
          node --check src/domain/request-workflow.mjs
          node --check tests/domain-authorization.test.mjs
          node --check tests/domain-workflow.test.mjs
          node --check src/local-pdf.mjs
          node --check src/identity-format.mjs
          node --check tests/identity-format.test.mjs
          node --check tests/local-pdf.test.mjs
          node --check tests/dev-guard.test.mjs
          node --check tests/project.test.mjs
          node --check server/demo-store.mjs
          node --check server/demo-http.mjs
          node --check server/api-contract.mjs
          node --check tests/api-contract.test.mjs
          node --check server/dev.mjs
          node --check tests/demo-store.test.mjs
          node --check tests/demo-http.test.mjs
      - name: Ejecutar pruebas
        run: node --test
      - name: Comprobar archivos fundamentales
        run: |
          test -s README.md
          test -s index.html
          test -s app/index.html
          test -s assets/site.css
          test -s assets/site.js
          test -s docs/PROGRESO.md
          test -s docs/RELEASE-GATES.md
          test -s docs/BACKEND-PLAN.md
          test -s tests/browser-smoke.sh
          test -s db/migrations/001_base_ve.sql
          test -s SECURITY.md
          test -s .github/CODEOWNERS

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: digifirma_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-not-production
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d digifirma_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGDATABASE: digifirma_ci
      PGUSER: postgres
      PGPASSWORD: ci-only-not-production
    steps:
      - uses: actions/checkout@v4
      - name: PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi
      - name: Ejecutar migración propuesta en CI
        run: psql -v ON_ERROR_STOP=1 -f db/migrations/001_base_ve.sql
      - name: Validar RLS y separación de organizaciones
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/rls.sql

  browser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Probar sitio y panel con Chrome headless
        run: bash tests/browser-smoke.sh
      - name: Verificar vista previa de registro con Chrome en tres tamaños
        run: bash tests/registro-browser-smoke.sh
      - name: Verificar identidad corporativa en sitio y panel con Chrome
        run: bash tests/brand-browser-smoke.sh
      - name: Guardar capturas de nuevo branding DigiFirma
        uses: actions/upload-artifact@v4
        with:
          name: digifirma-brand-preview
          path: artifacts/digifirma-*.png
          if-no-files-found: error
          retention-days: 7
      - name: Guardar capturas sintéticas de registro (sin desplegar)
        uses: actions/upload-artifact@v4
        with:
          name: digifirma-registro-preview
          path: artifacts/registro-*.png
          if-no-files-found: error
          retention-days: 7

  public-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Crear paquete público con whitelist estricta
        run: node scripts/build-public.mjs
      - name: Verificar paquete y aislamiento
        run: node --test tests/public-build.test.mjs
      - name: Guardar paquete para revisión (no publicar)
        uses: actions/upload-artifact@v4
        with:
          name: digifirma-ve-public-site
          path: dist/public/
          if-no-files-found: error
          retention-days: 7
